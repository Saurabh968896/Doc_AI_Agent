<!DOCTYPE html>
<html>
<head>
    <title>AI Document Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .card {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }

        label {
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #answerBox {
            background: #eef3ff;
            padding: 15px;
            border-radius: 8px;
            min-height: 50px;
        }

        .status {
            margin-top: 10px;
            font-size: 14px;
            color: green;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚀 AI Document Assistant</h1>

    <!-- Upload Section -->
    <div class="card">
        <h3>📄 Upload Document</h3>

        <form id="uploadForm">
            <label>User ID</label>
            <input type="text" name="user_id" required>

            <label>Select File</label>
            <input type="file" name="file" required>

            <button type="submit">Upload</button>
        </form>

        <div id="uploadStatus" class="status"></div>
    </div>

    <!-- Query Section -->
    <div class="card">
        <h3>💬 Ask Question</h3>

        <form id="queryForm">
            <label>User ID</label>
            <input type="text" name="user_id" required>

            <label>Select Model</label>
            <select name="model">
                <option value="phi3">phi3</option>
                <option value="phi3:mini">phi3-mini (fast)</option>
                <option value="llama3">llama3</option>
                <option value="openai">openai (future)</option>
                <option value="claude">claude (future)</option>
            </select>

            <label>Enter Question</label>
            <textarea name="question" rows="4"></textarea>

            <button type="submit">Ask</button>
        </form>

        <h3>🧠 Answer</h3>
        <div id="answerBox">Your answer will appear here...</div>
    </div>

</div>

<script>
    document.getElementById("uploadForm").onsubmit = async (e) => {
        e.preventDefault();

        let formData = new FormData(e.target);

        document.getElementById("uploadStatus").innerText = "Uploading...";

        let res = await fetch("/upload", {
            method: "POST",
            body: formData
        });

        let data = await res.json();

        document.getElementById("uploadStatus").innerText = "✅ Upload Successful!";
    };

    document.getElementById("queryForm").onsubmit = async (e) => {
        e.preventDefault();

        let formData = new FormData(e.target);

        document.getElementById("answerBox").innerText = "⏳ Thinking...";

        let res = await fetch("/query", {
            method: "POST",
            body: formData
        });

        let data = await res.json();

        document.getElementById("answerBox").innerText = data.answer;
    };
</script>

</body>
</html>
